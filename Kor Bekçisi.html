<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kor Bekçisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Düzen: tek sütun; üstte başlık ve gösterge, ortada 3:4 oyun alanı, altta ipuçları.
   Tek bir karanlık dünya olarak tasarlandı, bu yüzden açık tema yok. */
:root {
  --ink: #0d0b1f;
  --panel: #17133a;
  --line: #2d2760;
  --text: #f1ecff;
  --muted: #a29bd0;
  --ember: #ffb347;
  --ember-hot: #ffe6b0;
  --shade: #8b6bff;
  --font-display: "Syne", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background-color: var(--ink);
  background-image: radial-gradient(120% 55% at 50% 0%, #1d1747 0%, rgba(29, 23, 71, 0) 60%);
  color: var(--text);
  font-family: var(--font-mono);
  padding-inline: 16px;
  padding-block: 18px 24px;
}
.app {
  max-width: 520px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 12px;
  flex-wrap: wrap;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.7rem, 6vw, 2.3rem);
  letter-spacing: -0.03em;
  line-height: 1;
  text-wrap: balance;
}
.tag {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.hud {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding-block: 10px;
  border-block: 1px solid var(--line);
}
.stat { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.stat span {
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat b {
  font-weight: 500;
  font-size: 1.2rem;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}
.lives { display: flex; align-items: center; gap: 6px; min-height: 1.56rem; }
.lives i {
  display: block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--ember);
}
.lives i.on { background: var(--ember); }

.stage {
  position: relative;
  width: min(100%, max(240px, calc((100vh - 220px) * 0.75)));
  width: min(100%, max(240px, calc((100dvh - 220px) * 0.75)));
  margin-inline: auto;
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line);
  background: var(--ink);
  overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  background: rgba(13, 11, 31, 0.84);
}
.overlay h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.7rem, 7vw, 2.4rem);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.overlay p {
  margin: 0;
  max-width: 34ch;
  font-size: 0.84rem;
  line-height: 1.65;
  color: var(--muted);
}
.btn {
  font: 700 1rem var(--font-display);
  background: var(--ember);
  color: #241238;
  border: 0;
  padding: 12px 28px;
  border-radius: 4px;
  cursor: pointer;
}
.btn:hover { background: var(--ember-hot); }
.bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.hint {
  flex: 1 1 220px;
  min-width: 0;
  margin: 0;
  font-size: 0.74rem;
  line-height: 1.7;
  color: var(--muted);
}
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost {
  font: 500 0.8rem var(--font-mono);
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}
.ghost:hover { border-color: var(--ember); }
.ghost:disabled { opacity: 0.4; cursor: default; border-color: var(--line); }
:focus-visible { outline: 2px solid var(--ember-hot); outline-offset: 3px; }
</style>

<div class="app" lang="tr">
  <header>
    <h1>Kor Bekçisi</h1>
    <span class="tag">Karanlığa karşı tek ışık</span>
  </header>

  <div class="hud" aria-label="Oyun durumu">
    <div class="stat"><span>Skor</span><b id="hud-score">0</b></div>
    <div class="stat"><span>Rekor</span><b id="hud-best">0</b></div>
    <div class="stat"><span>Işık</span><b id="hud-light">100%</b></div>
    <div class="stat"><span>Can</span><div class="lives" id="hud-lives" role="img" aria-label="3 can"><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
  </div>

  <div class="stage">
    <canvas id="game" aria-label="Oyun alanı"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Kor Bekçisi</h2>
      <p id="ov-text"></p>
      <button class="btn" id="ov-btn" type="button">Başla</button>
    </div>
  </div>

  <div class="bar">
    <p class="hint">Fare ya da parmakla yönlendir. Klavyede ok tuşları veya WASD. P ile duraklat.</p>
    <div class="tools">
      <button class="ghost" id="pause-btn" type="button" disabled>Duraklat</button>
      <button class="ghost" id="sound-btn" type="button" aria-pressed="false">Ses: açık</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var W = 480, H = 640;
  var R_MAX = 200, R_MIN = 58, R_START = 150, SPEED = 230;
  var BG = '#0d0b1f';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var el = {
    score: document.getElementById('hud-score'),
    best: document.getElementById('hud-best'),
    light: document.getElementById('hud-light'),
    lives: document.getElementById('hud-lives'),
    overlay: document.getElementById('overlay'),
    title: document.getElementById('ov-title'),
    text: document.getElementById('ov-text'),
    btn: document.getElementById('ov-btn'),
    pause: document.getElementById('pause-btn'),
    sound: document.getElementById('sound-btn')
  };

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var best = 0;
  try { best = parseInt(localStorage.getItem('kor-bekcisi-best'), 10) || 0; } catch (e) {}

  var state = 'ready';
  var player, target, embers, shadows, particles, floaters;
  var scoreF, lives, light, combo, comboT, t, vt = 0, level, spawnE, spawnS, inv, shake, finalScore, newBest;
  var keys = {};

  function reset() {
    player = { x: W / 2, y: H / 2 + 60, r: 9 };
    target = { x: player.x, y: player.y, active: false };
    embers = []; shadows = []; particles = []; floaters = [];
    scoreF = 0; lives = 3; light = R_START; combo = 0; comboT = 0;
    t = 0; level = 1; spawnE = 1; spawnS = 4; inv = 0; shake = 0;
    spawnEmber(); spawnEmber(); spawnEmber();
  }

  function spawnEmber() {
    var x, y, tries = 0;
    do {
      x = 34 + Math.random() * (W - 68);
      y = 50 + Math.random() * (H - 100);
      tries++;
    } while (Math.hypot(x - player.x, y - player.y) < 110 && tries < 20);
    embers.push({ x: x, y: y, life: 9, max: 9, ph: Math.random() * 6.28 });
  }

  function spawnShadow() {
    var x, y, tries = 0;
    do {
      var side = (Math.random() * 4) | 0;
      if (side === 0) { x = -20; y = Math.random() * H; }
      else if (side === 1) { x = W + 20; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = -20; }
      else { x = Math.random() * W; y = H + 20; }
      tries++;
    } while (Math.hypot(x - player.x, y - player.y) < 220 && tries < 20);
    shadows.push({ x: x, y: y, r: 15 + Math.random() * 7, vx: 0, vy: 0, wob: Math.random() * 6.28 });
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, s = 40 + Math.random() * 120;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, c: color });
    }
  }

  /* Ses: kısa osilatör sesleri, ilk etkileşimden sonra çalışır */
  var actx = null, muted = false;
  function beep(freq, dur, type, vol, slide) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var now = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + dur);
      g.gain.setValueAtTime(vol || 0.06, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(now); o.stop(now + dur);
    } catch (e) {}
  }

  /* Oyun akışı */
  function showOverlay(kind) {
    if (kind === 'ready') {
      el.title.textContent = 'Kor Bekçisi';
      el.text.textContent = 'Karanlık her saniye daralıyor. Kor topla ve ışığını büyüt. Gölgeler ışığın dışında görünmez, yalnızca gözleri seçilir.';
      el.btn.textContent = 'Başla';
    } else if (kind === 'paused') {
      el.title.textContent = 'Duraklatıldı';
      el.text.textContent = 'Hazır olunca devam et.';
      el.btn.textContent = 'Devam et';
    } else {
      el.title.textContent = 'Işık söndü';
      el.text.textContent = 'Skor ' + finalScore + '. ' + (newBest ? 'Yeni rekor.' : 'Rekor ' + best + '.') + ' ' + Math.floor(t) + ' saniye dayandın.';
      el.btn.textContent = 'Tekrar oyna';
    }
    el.overlay.hidden = false;
    try { el.btn.focus({ preventScroll: true }); } catch (e) {}
  }

  function setPauseButton() {
    el.pause.disabled = !(state === 'playing' || state === 'paused');
    el.pause.textContent = state === 'paused' ? 'Devam et' : 'Duraklat';
  }

  function start() {
    reset();
    state = 'playing';
    el.overlay.hidden = true;
    setPauseButton();
    beep(440, 0.15, 'triangle', 0.06, 220);
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; showOverlay('paused'); }
    else if (state === 'paused') { state = 'playing'; el.overlay.hidden = true; }
    setPauseButton();
  }

  function gameOver() {
    state = 'over';
    finalScore = Math.floor(scoreF);
    newBest = finalScore > best;
    if (newBest) {
      best = finalScore;
      try { localStorage.setItem('kor-bekcisi-best', String(best)); } catch (e) {}
    }
    beep(220, 0.7, 'sine', 0.08, -140);
    setPauseButton();
    showOverlay('over');
  }

  function collect(e) {
    combo = comboT > 0 ? Math.min(5, combo + 1) : 1;
    comboT = 2.2;
    var pts = 10 * combo;
    scoreF += pts;
    light = Math.min(R_MAX, light + 34);
    burst(e.x, e.y, '#ffd391', 12);
    floaters.push({ x: e.x, y: e.y - 10, txt: '+' + pts, life: 0.9 });
    beep(520 + combo * 90, 0.12, 'triangle', 0.07, 220);
  }

  function hurt(s) {
    lives--;
    inv = 1.6;
    shake = reduceMotion ? 0 : 0.5;
    light = Math.max(R_MIN, light - 22);
    combo = 0; comboT = 0;
    var d = Math.hypot(s.x - player.x, s.y - player.y) || 1;
    s.vx = (s.x - player.x) / d * 240;
    s.vy = (s.y - player.y) / d * 240;
    burst(player.x, player.y, '#8b6bff', 16);
    beep(170, 0.3, 'sawtooth', 0.07, -90);
    if (lives <= 0) gameOver();
  }

  function update(dt) {
    t += dt;
    level = 1 + Math.floor(t / 25);
    scoreF += dt * 2;

    var dx = 0, dy = 0;
    if (keys.l) dx -= 1;
    if (keys.r) dx += 1;
    if (keys.u) dy -= 1;
    if (keys.d) dy += 1;
    if (dx || dy) {
      var l = Math.hypot(dx, dy);
      player.x += dx / l * SPEED * dt;
      player.y += dy / l * SPEED * dt;
      target.active = false;
    } else if (target.active) {
      var ex = target.x - player.x, ey = target.y - player.y, d = Math.hypot(ex, ey);
      if (d > 1) {
        var sp = Math.min(SPEED, d * 7);
        player.x += ex / d * sp * dt;
        player.y += ey / d * sp * dt;
      }
    }
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));

    light = Math.max(R_MIN, light - (5 + level * 0.8) * dt);
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (inv > 0) inv -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 1.5);

    spawnE -= dt;
    var maxE = level >= 4 ? 4 : 3;
    if (embers.length < maxE && spawnE <= 0) { spawnEmber(); spawnE = 1.2; }
    for (var i = embers.length - 1; i >= 0; i--) {
      var e = embers[i];
      e.life -= dt;
      if (e.life <= 0) { embers.splice(i, 1); continue; }
      if (Math.hypot(e.x - player.x, e.y - player.y) < player.r + 11) {
        collect(e);
        embers.splice(i, 1);
      }
    }

    spawnS -= dt;
    var maxS = Math.min(2 + level, 9);
    if (shadows.length < maxS && spawnS <= 0) { spawnShadow(); spawnS = Math.max(2, 6 - level * 0.4); }
    var sp2 = Math.min(105, 36 + level * 7);
    for (var j = 0; j < shadows.length && state === 'playing'; j++) {
      var s = shadows[j];
      var sx = player.x - s.x, sy = player.y - s.y, sd = Math.hypot(sx, sy) || 1;
      var ax = sx / sd, ay = sy / sd;
      var w = Math.sin(t * 1.6 + s.wob) * 0.35;
      var nx = ax - ay * w, ny = ay + ax * w;
      var k = Math.min(1, dt * 2.2);
      s.vx += (nx * sp2 - s.vx) * k;
      s.vy += (ny * sp2 - s.vy) * k;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (inv <= 0 && sd < player.r + s.r * 0.8) hurt(s);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(p, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vx *= 0.94; q.vy *= 0.94;
    }
    for (var f = floaters.length - 1; f >= 0; f--) {
      floaters[f].life -= dt;
      floaters[f].y -= 30 * dt;
      if (floaters[f].life <= 0) floaters.splice(f, 1);
    }
  }

  /* Çizim */
  function blobPath(s) {
    var n = 14;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = i / n * Math.PI * 2;
      var rr = s.r * (1 + 0.14 * Math.sin(vt * 3 + i * 1.9 + s.wob));
      var x = s.x + Math.cos(a) * rr, y = s.y + Math.sin(a) * rr;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

    ctx.fillStyle = BG;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    var pool = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, light);
    pool.addColorStop(0, 'rgba(255,179,71,0.24)');
    pool.addColorStop(1, 'rgba(255,179,71,0)');
    ctx.fillStyle = pool;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    ctx.fillStyle = 'rgba(140,130,215,0.16)';
    for (var gx = 40; gx < W; gx += 40) for (var gy = 40; gy < H; gy += 40) ctx.fillRect(gx - 1, gy - 1, 2, 2);

    var i, s, e;
    for (i = 0; i < shadows.length; i++) {
      s = shadows[i];
      blobPath(s);
      ctx.fillStyle = '#04030f';
      ctx.fill();
      ctx.strokeStyle = 'rgba(139,107,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    var fog = ctx.createRadialGradient(player.x, player.y, light * 0.35, player.x, player.y, light);
    fog.addColorStop(0, 'rgba(8,6,22,0)');
    fog.addColorStop(0.6, 'rgba(8,6,22,0.25)');
    fog.addColorStop(1, 'rgba(8,6,22,0.96)');
    ctx.fillStyle = fog;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    for (i = 0; i < embers.length; i++) {
      e = embers[i];
      var d = Math.hypot(e.x - player.x, e.y - player.y);
      var a = d < light * 0.9 ? 1 : 0.45;
      if (e.life < 2.5) a *= 0.55 + 0.45 * Math.sin(vt * 16);
      var pr = 26 * (1 + 0.18 * Math.sin(vt * 5 + e.ph));
      var g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, pr);
      g.addColorStop(0, 'rgba(255,200,110,0.85)');
      g.addColorStop(1, 'rgba(255,179,71,0)');
      ctx.globalAlpha = a;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, pr, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffe6b0';
      ctx.beginPath(); ctx.arc(e.x, e.y, 4.5, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,230,176,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, 9, -Math.PI / 2, -Math.PI / 2 + 6.283 * (e.life / e.max)); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (i = 0; i < shadows.length; i++) {
      s = shadows[i];
      var sd = Math.hypot(s.x - player.x, s.y - player.y) || 1;
      var ox = (player.x - s.x) / sd * 2, oy = (player.y - s.y) / sd * 2;
      var ea = sd < light * 0.85 ? 0.95 : 0.55;
      ctx.globalAlpha = ea * 0.2;
      ctx.fillStyle = '#b7a1ff';
      ctx.beginPath(); ctx.arc(s.x - 5 + ox, s.y - 2 + oy, 6, 0, 6.283); ctx.arc(s.x + 5 + ox, s.y - 2 + oy, 6, 0, 6.283); ctx.fill();
      ctx.globalAlpha = ea;
      ctx.fillStyle = '#d9ccff';
      ctx.beginPath(); ctx.arc(s.x - 5 + ox, s.y - 2 + oy, 2.3, 0, 6.283); ctx.arc(s.x + 5 + ox, s.y - 2 + oy, 2.3, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }

    var blink = inv > 0 && Math.floor(vt * 14) % 2 === 0;
    ctx.globalAlpha = blink ? 0.35 : 1;
    var pg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, 44);
    pg.addColorStop(0, 'rgba(255,224,170,0.7)');
    pg.addColorStop(1, 'rgba(255,179,71,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(player.x, player.y, 44, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff3d6';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#ffb347';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 3, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = 1;

    for (i = 0; i < particles.length; i++) {
      var q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.c;
      ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    ctx.font = '500 14px "DM Mono", ui-monospace, monospace';
    ctx.textAlign = 'center';
    for (i = 0; i < floaters.length; i++) {
      ctx.globalAlpha = Math.min(1, floaters[i].life * 2);
      ctx.fillStyle = '#ffe6b0';
      ctx.fillText(floaters[i].txt, floaters[i].x, floaters[i].y);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'left';
    if (combo > 1) {
      ctx.fillStyle = '#ffb347';
      ctx.fillText('x' + combo + ' kombo', 14, 26);
    }
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(162,155,208,0.9)';
    ctx.fillText('Seviye ' + level, W - 14, 26);

    ctx.restore();
  }

  var hs = -1, hb = -1, hl = -1, hlive = -1;
  function hud() {
    var s = Math.floor(scoreF);
    if (s !== hs) { hs = s; el.score.textContent = s; }
    if (best !== hb) { hb = best; el.best.textContent = best; }
    var lp = Math.round((light - R_MIN) / (R_MAX - R_MIN) * 100);
    if (lp !== hl) { hl = lp; el.light.textContent = lp + '%'; }
    if (lives !== hlive) {
      hlive = lives;
      var dots = el.lives.children;
      for (var i = 0; i < dots.length; i++) dots[i].className = i < lives ? 'on' : '';
      el.lives.setAttribute('aria-label', lives + ' can');
    }
  }

  var last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - last) / 1000 || 0);
    last = ts;
    vt += dt;
    if (state === 'playing') update(dt);
    draw();
    hud();
  }

  /* Girdi */
  function setTarget(ev) {
    var r = canvas.getBoundingClientRect();
    target.x = (ev.clientX - r.left) / r.width * W;
    target.y = (ev.clientY - r.top) / r.height * H;
    target.active = true;
  }
  canvas.addEventListener('pointerdown', function (ev) {
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    setTarget(ev);
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'mouse' || ev.buttons) setTarget(ev);
  });

  var keymap = {
    ArrowLeft: 'l', a: 'l', A: 'l',
    ArrowRight: 'r', d: 'r', D: 'r',
    ArrowUp: 'u', w: 'u', W: 'u',
    ArrowDown: 'd', s: 'd', S: 'd'
  };
  window.addEventListener('keydown', function (ev) {
    var k = keymap[ev.key];
    if (k) {
      if (state === 'playing') { keys[k] = true; ev.preventDefault(); }
    } else if (ev.key === 'p' || ev.key === 'P' || ev.key === 'Escape') {
      togglePause();
    }
  });
  window.addEventListener('keyup', function (ev) {
    var k = keymap[ev.key];
    if (k) keys[k] = false;
  });
  window.addEventListener('blur', function () { keys = {}; });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });

  el.btn.addEventListener('click', function () {
    if (state === 'paused') togglePause(); else start();
  });
  el.pause.addEventListener('click', togglePause);
  el.sound.addEventListener('click', function () {
    muted = !muted;
    el.sound.textContent = muted ? 'Ses: kapalı' : 'Ses: açık';
    el.sound.setAttribute('aria-pressed', muted ? 'true' : 'false');
  });

  reset();
  showOverlay('ready');
  requestAnimationFrame(frame);
})();
</script>

</body></html>
